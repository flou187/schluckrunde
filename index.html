<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100e24">
<title>Schluckrunde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: sticker board at night. Light outlines, indigo offset shadows, dotted dark paper, one bright colour per game. */
:root{
  --bg:#100e24; --dot:#221e45; --card:#1b1838; --card2:#25214b; --field:#141130;
  --ink:#f1eeff; --dk:#16133a; --muted:#a7a2d6; --sh:#6c5cff; --line:#2f2a5c;
  --coral:#ff5a76; --blue:#5b74ff; --lemon:#ffd84d; --mint:#2fe0a8; --lilac:#b49cff; --orange:#ff9a3d; --pink:#ff8fd0; --sky:#57d6ff;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
body.noscroll{overflow:hidden}
#app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.1}
h1{font-size:clamp(1.55rem,6vw,2.1rem)}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.center{text-align:center}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lemon);outline-offset:3px}
.box{background:var(--card);border:2.5px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--sh);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:.01em;border:2.5px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--sh);
  background:var(--lemon);color:var(--dk);padding:14px 18px;transition:transform .07s,box-shadow .07s;text-align:center}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--sh)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--sh)}
.btn.coral{background:var(--coral);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.mint{background:var(--mint)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.big{font-size:1.15rem;padding:18px}
.btn.small{font-size:.78rem;padding:8px 12px;border-radius:12px;box-shadow:3px 3px 0 var(--sh)}
.btn.small:active{transform:translate(3px,3px)}
.wide{width:100%}
input[type=text]{width:100%;background:var(--field);border:2.5px solid var(--ink);border-radius:14px;color:var(--ink);font:inherit;font-size:1.1rem;padding:12px 14px;font-weight:500}
input::placeholder{color:#6f6a9e}
label{font-family:var(--display);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.logo{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;border-radius:7px;background:var(--coral);border:2.5px solid var(--ink);transform:rotate(-8deg)}
.chip{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.14em;background:var(--lemon);color:var(--dk);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px}
.hero{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.word{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,13vw,4.2rem);line-height:.92;letter-spacing:-.04em;margin:0}
.word span{display:inline-block;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:0 .18em .06em;box-shadow:5px 5px 0 var(--sh);transform:rotate(-2deg);margin-top:6px}
.stickers{display:flex;flex-wrap:wrap;gap:8px}
.sticker{font-family:var(--display);font-weight:700;font-size:.7rem;border:2px solid var(--ink);border-radius:999px;padding:4px 10px;background:var(--card2)}
/* avatar */
.av{display:block;flex:none;border-radius:30%;border:2.5px solid var(--ink);background:var(--card2)}
.profile{flex-direction:row;align-items:center;gap:16px}
.av-btn{border:0;background:none;padding:0;position:relative;flex:none}
.av-btn .pen{position:absolute;right:-8px;bottom:-8px;background:var(--blue);color:#fff;border:2.5px solid var(--ink);border-radius:999px;font-family:var(--display);font-weight:700;font-size:.62rem;padding:3px 8px}
.builder{gap:16px}
.bhead{display:flex;align-items:center;gap:16px}
.bhead .acts{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.tab{flex:none;font-family:var(--display);font-weight:700;font-size:.72rem;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;background:var(--card2);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--dk)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px}
.opt{border:0;background:none;padding:0;border-radius:30%;position:relative;line-height:0}
.opt .av{width:100%;height:auto}
.opt.on .av,.opt.on .swatch{box-shadow:0 0 0 3px var(--lemon)}
.swatch{width:100%;aspect-ratio:1;border-radius:30%;border:2.5px solid var(--ink);display:block}
.actions{display:flex;flex-direction:column;gap:12px}
.join{display:flex;gap:10px}
.join input{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:700;text-align:center;font-size:1.1rem}
.join .btn{flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;font-weight:700}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.note{font-size:.88rem;color:var(--muted)}
.err{background:#3a1424;border:2.5px solid var(--coral);border-radius:14px;padding:10px 14px;font-weight:700;font-size:.92rem}
/* game tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:12px;min-width:0;background:var(--c);color:var(--fg,var(--dk));position:relative}
.tile .ic{font-family:var(--display);font-weight:800;font-size:1.2rem;width:40px;height:40px;border-radius:12px;background:#fff;color:var(--dk);border:2.5px solid var(--dk);display:grid;place-items:center}
.tile h3{font-size:.85rem}
.tile p{font-size:.8rem;line-height:1.3;opacity:.92}
.tile .kind{position:absolute;top:10px;right:10px;font-size:.58rem;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--dk);border:2px solid var(--dk);border-radius:999px;padding:2px 7px}
button.tile:not(.on){filter:saturate(.15) brightness(.55);box-shadow:2px 2px 0 var(--sh)}
button.tile.on::after{content:"✓";position:absolute;bottom:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--dk);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.8rem}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--card2)}
.seg button{border:0;background:none;padding:12px;font-family:var(--display);font-weight:700;font-size:.85rem}
.seg button.on{background:var(--ink);color:var(--dk)}
.rounds{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rounds .tab{font-size:.85rem;padding:8px 14px}
footer{text-align:center;font-size:.82rem;color:var(--muted);padding-top:4px}
/* lobby */
.codecard{display:flex;flex-direction:row;align-items:center;gap:16px;background:var(--lemon);color:var(--dk)}
.codecard .eyebrow{color:var(--dk)}
.codecard .code{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,12vw,3.4rem);letter-spacing:.12em;line-height:1}
.codecard .side{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.codecard .btn{background:var(--dk);color:#fff}
.plist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:12px;min-width:0}
.plist .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--display);font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--card2);flex:none}
.tag.host{background:var(--coral);color:#fff}
.rm{border:0;background:none;font-size:1.4rem;padding:0 6px;color:var(--muted)}
.addrow{display:flex;gap:10px}
.addrow .btn{flex:none}
/* play */
.round{display:flex;justify-content:space-between;align-items:center;gap:10px}
.round .gname{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:.9rem}
.round .gname i{width:14px;height:14px;border-radius:5px;border:2px solid var(--ink);background:var(--c)}
.round .rn{font-family:var(--display);font-weight:700;font-size:.75rem;color:var(--muted)}
.stage{border-top:12px solid var(--c)}
.q{font-size:clamp(1.3rem,5.4vw,1.75rem)}
.guessrow{display:flex;gap:10px;align-items:center}
.guessrow input{font-family:var(--display);font-size:1.4rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.unit{font-weight:700;color:var(--muted);flex:none}
.sent{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--field);border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px}
.sent b{font-family:var(--display);font-size:1.1rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .btn{font-size:1.1rem;padding:20px 10px;background:var(--card2);color:var(--ink)}
.duo .btn.on{background:var(--blue);color:#fff}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio .btn{padding:16px 6px;font-size:.9rem;background:var(--card2);color:var(--ink)}
.trio .btn.on.v0{background:var(--coral);color:#fff}.trio .btn.on.v1{background:var(--lemon);color:var(--dk)}.trio .btn.on.v2{background:var(--mint);color:var(--dk)}
.vote{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.vote button{display:flex;align-items:center;gap:10px;background:var(--card2);border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:left;min-width:0;box-shadow:3px 3px 0 var(--sh)}
.vote button span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vote button.on{background:var(--coral);color:#fff}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{position:relative;line-height:0}
.dot.wait .av{opacity:.3;filter:grayscale(1)}
.dot.done::after{content:"✓";position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--mint);color:var(--dk);border:2px solid var(--ink);font-size:10px;line-height:14px;text-align:center;font-weight:800}
.cards{display:flex;align-items:center;justify-content:center;gap:14px}
.pcard{width:100px;max-width:38vw;aspect-ratio:5/7;background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--sh);color:var(--dk);position:relative;display:grid;place-items:center;flex:none}
.pcard.red{color:#e0263f}
.pcard .big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
.pcard .cr{position:absolute;font-weight:700;font-size:.9rem;line-height:1;text-align:center}
.pcard .cr.tl{top:8px;left:9px}.pcard .cr.br{bottom:8px;right:9px;transform:rotate(180deg)}
.pcard.back{background:repeating-linear-gradient(45deg,var(--blue) 0 9px,#3f56e0 9px 18px)}
.arrow{font-family:var(--display);font-weight:800;font-size:1.6rem}
.pass{align-items:center;text-align:center}
.truth{background:var(--lemon);color:var(--dk);border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.truth .eyebrow{color:var(--dk)}
.truth b{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.res li{display:flex;align-items:center;gap:12px;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.res .who{flex:1;min-width:0;display:flex;flex-direction:column}
.res .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .who small{color:var(--muted);font-size:.8rem}
.res .val{font-weight:700;text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums;min-width:0}
.sip{flex:none;background:var(--coral);color:#fff;border:2px solid var(--ink);font-family:var(--display);font-weight:700;border-radius:999px;padding:3px 9px;font-size:.72rem;white-space:nowrap}
.safe{flex:none;background:var(--mint);color:var(--dk);border:2px solid var(--ink);font-family:var(--display);font-weight:700;border-radius:999px;padding:3px 9px;font-size:.72rem}
.ex{font-family:var(--display);font-weight:700;font-size:.95rem;text-align:center;color:var(--lemon)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 150px}
.progress{height:12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--field);overflow:hidden}
.progress i{display:block;height:100%;background:var(--mint)}
.timer{display:flex;align-items:center;gap:10px}
.timer .tb{flex:1;height:10px;border-radius:999px;background:var(--field);border:2px solid var(--line);overflow:hidden}
.timer .tb i{display:block;height:100%;background:var(--c,var(--lemon));width:100%;transition:width .25s linear}
.timer span{font-family:var(--display);font-weight:700;font-size:.75rem;color:var(--muted);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.wait-big{text-align:center;padding:30px 16px;align-items:center}
.spinner{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--lemon);animation:spin 1.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drawing{width:min(100%,340px);aspect-ratio:1;margin:0 auto;display:block;border:2.5px solid var(--ink);border-radius:18px;background:#fff;box-shadow:5px 5px 0 var(--sh);object-fit:contain}
.refbtn{align-self:center;text-decoration:none;display:inline-block}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gallery figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.gallery img{width:100%;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:14px;background:#fff;display:block}
.gallery figcaption{font-size:.82rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Mehr oder Weniger */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.term{border:2.5px solid var(--ink);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;min-width:0;background:var(--card2)}
.term.a{background:var(--blue);color:#fff}
.term b{font-family:var(--display);font-weight:800;font-size:clamp(.95rem,4.4vw,1.25rem);line-height:1.15;overflow-wrap:anywhere}
.term .views{font-family:var(--display);font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.term .views.q{font-size:1.6rem}
.term.ok{background:var(--mint);color:var(--dk)}
.vsx{font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:.9rem;color:var(--muted)}
.alive{display:flex;flex-wrap:wrap;gap:6px}
.out .av{opacity:.3;filter:grayscale(1)}
.src{font-size:.75rem;color:var(--muted);text-align:center}
/* Tic-Tac-Toe */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,330px);margin:0 auto}
.board button{aspect-ratio:1;border:2.5px solid var(--ink);border-radius:16px;background:var(--card2);font-family:var(--display);font-weight:800;font-size:clamp(2rem,12vw,3.4rem);line-height:1;padding:0;display:grid;place-items:center}
.board button:disabled{cursor:default}
.board .X{color:var(--coral)}.board .O{color:var(--sky)}
.board button.win{background:var(--lemon);color:var(--dk)}
.board.mini{width:96px;gap:3px}
.board.mini span{aspect-ratio:1;border:1.5px solid var(--line);border-radius:6px;background:var(--card2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.9rem}
.duel{display:flex;align-items:center;justify-content:center;gap:12px}
.duel .side{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;max-width:40%}
.duel .side b{font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.duel .side.turn .av{box-shadow:0 0 0 3px var(--lemon)}
.duel .mk{font-family:var(--display);font-weight:800;font-size:1rem}
.turnline{text-align:center;font-family:var(--display);font-weight:700}
.matches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.match{display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.match small{font-size:.75rem;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
/* Busfahrer */
.bushero{background:linear-gradient(135deg,var(--card) 0%,var(--card2) 100%);border-top:12px solid var(--orange)}
.bc{width:64px;aspect-ratio:5/8;background:#fffaf0;border:2.5px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--sh);position:relative;display:grid;place-items:center;flex:none;color:var(--dk)}
.bc .bl{position:absolute;top:4px;left:6px;font-family:var(--display);font-weight:800;font-size:.85rem;line-height:1}
.bc .bl.br{top:auto;left:auto;bottom:4px;right:6px;transform:rotate(180deg)}
.bc.sm{width:42px;border-width:2px;border-radius:8px;box-shadow:2px 2px 0 var(--sh)}
.bc.sm .bl{font-size:.68rem;top:3px;left:4px}.bc.sm .bl.br{bottom:3px;right:4px}
.bc.lg{width:96px}
.bc.lg .bl{font-size:1.1rem}
.bc.back{background:repeating-linear-gradient(45deg,var(--orange) 0 7px,#e8852a 7px 14px)}
.bc.hl{outline:3px solid var(--lemon);outline-offset:2px}
.bc.ghost{opacity:.25}
.hands{display:flex;flex-direction:column;gap:10px}
.hand{display:flex;align-items:center;gap:10px;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.hand.on{border-color:var(--lemon)}
.hand .who{display:flex;flex-direction:column;min-width:0;flex:1}
.hand .who b{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hand .who small{font-size:.72rem;color:var(--muted)}
.hand .cs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.laybtn{border:0;background:none;padding:0;border-radius:8px}
.laybtn:disabled{cursor:default}
.laybtn:not(:disabled) .bc{outline:3px solid var(--mint);outline-offset:2px;animation:wig 1s ease-in-out infinite}
@keyframes wig{50%{transform:translateY(-3px)}}
.pyr{display:flex;flex-direction:column-reverse;align-items:center;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow small{font-family:var(--display);font-weight:700;font-size:.62rem;color:var(--muted);width:3.6em;text-align:right}
.pslot{position:relative}

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ---------- Verbindung: PeerJS, der Host ist der Knoten, Spieler verbinden sich zu ihm ---------- */
const PREFIX = 'schluckrunde-v3-';
function makePeer(id){
  const peer = id ? new Peer(id, {debug:0}) : new Peer({debug:0});
  peer.on('disconnected', ()=>{ if(!peer.destroyed) setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} }, 1000); });
  return peer;
}
function emitter(){
  const hs = new Set(); let t = null;
  return { add(fn){ hs.add(fn); return ()=>hs.delete(fn); }, fire(){ clearTimeout(t); t=setTimeout(()=>hs.forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } }),0); } };
}
function openHub(code){
  return new Promise((resolve, reject)=>{
    const peer = makePeer(PREFIX+code);
    const ev = emitter(), errs = new Set();
    const self = {peer:null, sameTab:true, kind:'viewer', presence:{}};
    const conns = new Map();
    let opened = false;
    const send = c => { try{ if(c.open) c.send({t:'host', presence:self.presence}); }catch(e){} };
    const api = {
      peers: () => [self, ...[...conns.values()].filter(x=>x.ready).map(x=>x.entry)],
      onPeers(fn, onErr){ if(onErr) errs.add(onErr); return ev.add(fn); },
      presence(patch){ for(const k in patch){ if(patch[k]===null) delete self.presence[k]; else self.presence[k]=patch[k]; } conns.forEach(x=>send(x.conn)); return Promise.resolve(); },
      leave(){ try{ peer.destroy(); }catch(e){} return Promise.resolve(); }
    };
    peer.on('open', id=>{ opened=true; self.peer=id; resolve(api); });
    peer.on('connection', conn=>{
      const x = {conn, ready:false, entry:{peer:conn.peer, sameTab:false, kind:'viewer', presence:{}}};
      conns.set(conn.peer, x);
      conn.on('open', ()=>{ x.ready=true; send(conn); ev.fire(); });
      conn.on('data', m=>{
        if(!m || m.t!=='pres' || typeof m.presence!=='object') return;
        const p = m.presence;
        x.entry = {...x.entry, presence:{role:p.role==='player'?'player':'', p:p.p, ans:p.ans, act:p.act}};
        ev.fire();
      });
      const drop = ()=>{ if(conns.get(conn.peer)===x){ conns.delete(conn.peer); ev.fire(); } };
      conn.on('close', drop); conn.on('error', drop);
    });
    peer.on('error', e=>{ if(!opened){ try{ peer.destroy(); }catch(_){} reject({code: e.type==='unavailable-id' ? 'taken' : (e.type||'Fehler')}); } });
    setTimeout(()=>{ if(!opened){ try{ peer.destroy(); }catch(_){} reject({code:'Zeitüberschreitung'}); } }, 12000);
  });
}
function openLeaf(code){
  return new Promise((resolve, reject)=>{
    const peer = makePeer();
    const ev = emitter(), errs = new Set();
    const self = {peer:null, sameTab:true, kind:'viewer', presence:{}};
    let host = null, conn = null, done = false, closed = false;
    const push = () => { try{ if(conn && conn.open) conn.send({t:'pres', presence:self.presence}); }catch(e){} };
    const api = {
      peers: () => host ? [self, host] : [self],
      onPeers(fn, onErr){ if(onErr) errs.add(onErr); return ev.add(fn); },
      presence(patch){ for(const k in patch){ if(patch[k]===null) delete self.presence[k]; else self.presence[k]=patch[k]; } push(); return Promise.resolve(); },
      leave(){ closed=true; try{ peer.destroy(); }catch(e){} return Promise.resolve(); }
    };
    const fail = c => { if(done) return; done=true; try{ peer.destroy(); }catch(_){} reject({code:c}); };
    peer.on('open', id=>{
      self.peer = id;
      conn = peer.connect(PREFIX+code, {reliable:true});
      conn.on('open', ()=>{ if(done) return; done=true; push(); resolve(api); });
      conn.on('data', m=>{ if(m && m.t==='host' && m.presence && typeof m.presence==='object'){ host = {peer:conn.peer, sameTab:false, kind:'viewer', presence:m.presence}; ev.fire(); } });
      conn.on('close', ()=>{ host=null; ev.fire(); if(!closed) errs.forEach(f=>f({code:'Host weg'})); });
    });
    peer.on('error', e=>{ if(!done) fail(e.type==='peer-unavailable' ? 'not_found' : (e.type||'Fehler')); });
    setTimeout(()=>fail('not_found'), 10000);
  });
}
</script>

  S.peerMap = {}; peers.forEach(p=>{ S.peerMap[p.peer]=p; });
  const me = peers.find(p=>p.sameTab); if(me && me.peer) S.myId = me.peer;
  const entries = [{id:S.myId, n:cleanName(S.me.name), av:S.me.av}];
  for(const p of peers){
    if(p.sameTab || !p.presence || p.presence.role!=='player') continue;
    const pp = p.presence.p || {};
    entries.push({id:p.peer, n:cleanName(pp.n), av:cleanAv(pp.av)});
  }
  const prev = S.G.pl.map(x=>x.id);
  entries.sort((a,b)=>{ const ia=prev.indexOf(a.id), ib=prev.indexOf(b.id); return (ia<0?999:ia)-(ib<0?999:ib); });
  S.G.pl = entries.slice(0,12);
  if(S.G.kind==='bus'){ if(S.G.ph==='play') busSync(); else pushG(); return; }
  if(S.G.ph==='play') checkAnswers(); else pushG();
}
function checkAnswers(){
  const G = S.G, a = answersFor(G);
  if(G.gt==='ttt'){ applyTtt(a); return afterTtt(); }
  if(G.gt==='hol' && G.sub!=='guess') return pushG();
  if(G.gt==='draw' && G.sub==='draw') for(const id in a) S.drawings[id] = a[id].img;
  G.ac = Object.keys(a);
  const need = needed(G);
  if(need.length && need.every(p=>p.id in a)){ clearSchedule(); advance(); } else pushG();
}
function advance(){
  const G = S.G;
  if(G.gt==='draw'){ if(G.sub==='draw') return toVote(); return nextVote(); }
  if(G.gt==='hol'){ if(G.sub==='guess') return resolveHol(); return; }
  if(G.gt==='ttt'){ (G.ttt||[]).forEach(m=>{ if(!m.w) m.w='d'; }); return reveal(); }
  reveal();
}
const newKey = () => Math.random().toString(36).slice(2,8);
function resetAnswers(){ S.myAns=null; S.localAnswers={}; S.localIdx=0; S.localReady=false; if(S.mode==='host') S.nr.presence({ans:null}); }

/* Mehr oder Weniger: Kette von Begriffen, wer falsch tippt, fliegt raus */
function startHol(){
  const G = S.G, chain = buildChain();
  if(chain.length<4){ G.gt='schaetzen'; G.qi=nextFrom('s',QS.length); schedule(T_PLAY.schaetzen, advance); return pushG(); }
  G.hchain=chain; G.hi=0; G.alive=G.pl.map(p=>p.id); G.out={};
  holStep();
}
function holStep(){
  const G = S.G; G.sub='guess'; G.rk=newKey(); G.ac=[]; G.hres=null; resetAnswers();
  schedule(T_HOL, resolveHol); pushG();
}
function resolveHol(){
  const G = S.G; if(G.ph!=='play' || G.gt!=='hol' || G.sub!=='guess') return;
  const a = answersFor(G), A = G.hchain[G.hi], B = G.hchain[G.hi+1];
  const truth = B.v>A.v ? 'h' : B.v<A.v ? 't' : '=';
  const wrong = G.alive.filter(id => truth!=='=' && a[id]!==truth);
  const all = wrong.length>0 && wrong.length===G.alive.length;
  wrong.forEach(id=>{ G.out[id] = G.hi; });
  if(!all) G.alive = G.alive.filter(id=>!wrong.includes(id));
  G.hres = {truth, wrong, all}; G.sub = 'show';
  const done = all || G.alive.length<=1 || G.hi+2 >= G.hchain.length;
  schedule(T_HOLSHOW, done ? reveal : ()=>{ G.hi++; holStep(); });
  pushG();
}

/* Tic-Tac-Toe: Paare, bei ungerader Zahl spielt einer gegen den Bot */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(bd){ for(const [x,y,z] of LINES) if(bd[x]!=='.' && bd[x]===bd[y] && bd[y]===bd[z]) return bd[x]; return bd.includes('.') ? '' : 'd'; }
function tttLine(bd){ for(const l of LINES) if(bd[l[0]]!=='.' && bd[l[0]]===bd[l[1]] && bd[l[1]]===bd[l[2]]) return l; return []; }
function tttMove(m, side, cell){
  if(m.w || m.t!==side || m.bd[cell]!=='.') return false;
  m.bd = m.bd.slice(0,cell) + (side==='a'?'X':'O') + m.bd.slice(cell+1);
  const w = tttWinner(m.bd); m.w = w==='X' ? 'a' : w==='O' ? 'b' : w;
  m.t = side==='a' ? 'b' : 'a'; m.at = Date.now();
  return true;
}
function botCell(m){
  const bd = m.bd, free = [...Array(9).keys()].filter(i=>bd[i]==='.');
  const winFor = s => free.find(i => tttWinner(bd.slice(0,i)+s+bd.slice(i+1))===s);
  let c = winFor('O'); if(c!==undefined) return c;
  c = winFor('X'); if(c!==undefined && Math.random()<.8) return c;
  if(bd[4]==='.' && Math.random()<.6) return 4;
  return free[Math.floor(Math.random()*free.length)];
}
function startTtt(){
  const G = S.G, ids = shuffle(G.pl.map(p=>p.id)), ms = [];
  for(let i=0;i<ids.length;i+=2) ms.push({a:ids[i], b:ids[i+1]||'bot', bd:'.........', t:Math.random()<.5?'a':'b', w:'', ca:0, cb:0, at:Date.now()});
  G.ttt = ms; G.tdone = false;
  schedule(T_PLAY.ttt, advance);
  clearInterval(S.tttIv);
  if(S.mode==='host') S.tttIv = setInterval(()=>{
    const g = S.G; if(!g || g.gt!=='ttt' || g.ph!=='play'){ clearInterval(S.tttIv); return; }
    let moved = false;
    for(const m of g.ttt){ if(!m.w && m[m.t]!=='bot' && Date.now()-m.at > T_TTTMOVE){ const free=[...Array(9).keys()].filter(i=>m.bd[i]==='.'); moved = tttMove(m, m.t, free[Math.floor(Math.random()*free.length)]) || moved; } }
    if(moved) afterTtt();
  }, 1000);
  afterTtt();
}
function applyTtt(a){
  for(const m of (S.G.ttt||[])) for(const side of ['a','b']){
    const id = m[side]; if(id==='bot' || !a[id]) continue;
    const mv = a[id].mv, key = 'c'+side;
    while(mv.length > m[key] && !m.w && m.t===side){ tttMove(m, side, mv[m[key]]); m[key]++; }
    if(m.w) m[key] = mv.length;
  }
}
function afterTtt(){
  const G = S.G; if(G.ph!=='play' || G.gt!=='ttt') return;
  for(const m of G.ttt){
    if(!m.w && m.b==='bot' && m.t==='b' && !m.bp){ m.bp = true; setTimeout(()=>{ m.bp=false; if(S.G===G && G.ph==='play' && tttMove(m,'b',botCell(m))) afterTtt(); }, 700); }
  }
  if(G.ttt.every(m=>m.w) && !G.tdone){ G.tdone = true; clearSchedule(); setTimeout(()=>{ if(S.G===G && G.ph==='play') reveal(); }, 1800); }
  pushG();
}
function startRound(){
  const G = S.G;
  if(G.mode==='mix') G.gt = G.plan[G.r] || G.plan[G.plan.length-1] || 'schaetzen';
  G.r++; G.rk = Math.random().toString(36).slice(2,8); G.seed = Math.floor(Math.random()*1e9);
  G.ph='play'; G.res=null; G.ac=[]; G.top=null; G.hd=''; G.sub=''; G.cur=null; G.gal=null;
  if(G.gt==='schaetzen') G.qi = nextFrom('s', QS.length);
  if(G.gt==='wwe') G.qi = pickWwe(G);
  if(G.gt==='draw'){ G.qi = nextFrom('d', DRAWQ.length); G.sub='draw'; S.drawings={}; S.votes={}; }
  G.hchain=null; G.hres=null; G.alive=[]; G.out={}; G.ttt=null;
  resetAnswers();
  if(G.gt==='hol') return startHol();
  if(G.gt==='ttt') return startTtt();
  schedule(T_PLAY[G.gt], advance);
  pushG();
}
function toVote(){
  const G = S.G;
  if(S.mode==='local') for(const id in S.localAnswers) S.drawings[id] = S.localAnswers[id].img;
  const order = shuffle(G.pl.map(p=>p.id).filter(id=>S.drawings[id]));
  G.vorder = order; G.vi = 0; G.vn = order.length;
  if(!order.length) return reveal();
  G.sub = 'vote'; startVoteItem();
}
function startVoteItem(){
  const G = S.G, id = G.vorder[G.vi];
  G.rk = Math.random().toString(36).slice(2,8); G.ac = [];
  G.cur = {id, img:S.drawings[id]};
  S.myAns=null; S.localAnswers={};
  if(S.mode==='host') S.nr.presence({ans:null});
  schedule(T_VOTE, nextVote);
  pushG();
}
function nextVote(){
  const G = S.G, a = answersFor(G);
  if(G.cur && S.mode!=='local') S.votes[G.cur.id] = Object.entries(a).filter(([id])=>id!==G.cur.id).map(([,v])=>v);
  G.vi++;
  if(G.vi >= G.vorder.length) reveal(); else startVoteItem();
}
// Rangliste: bester Wert gewinnt und verteilt 2, schlechtester trinkt 3, alle dazwischen 1
function ranked(G, scores, disp, bonus){
  const got = G.pl.filter(p=>p.id in scores).map(p=>({id:p.id, sc:scores[p.id]})).sort((a,b)=>b.sc-a.sc);
  const res = [];
  if(got.length){
    const best=got[0].sc, worst=got[got.length-1].sc;
    for(const g of got){
      let s=1, t='', w=0, dd=0;
      if(best===worst){ s=0; t='Gleichstand'; }
      else if(g.sc===best){ s=0; w=1; dd=bonus?bonus(g.id):2; t='Gewinner · verteilt '+dd; }
      else if(g.sc===worst){ s=3; t='Letzter Platz'; }
      res.push({id:g.id, v:disp(g.id), s, t, w, dd});
    }
  }
  G.pl.filter(p=>!(p.id in scores)).forEach(p=>res.push({id:p.id, v:'–', s:3, t:'Nicht dabei', w:0, dd:0}));
  return res;
}
function reveal(){
  const G = S.G; if(G.ph!=='play') return;
  clearInterval(S.tttIv);
  const a = answersFor(G);
  let res = [];
  if(G.gt==='schaetzen'){
    const Q = QS[G.qi], sc = {};
    for(const id in a) sc[id] = -Math.abs(a[id]-Q.a);
    res = ranked(G, sc, id=>fmt(a[id],Q), id=>a[id]===Q.a?4:2);
  } else if(isMini(G.gt)){
    const sc = {}; for(const id in a) sc[id] = a[id].sc;
    res = ranked(G, sc, id=>a[id].d);
  } else if(G.gt==='draw'){
    const sc = {}, info = {};
    for(const id of (G.vorder||[])){
      const v = S.votes[id] || []; const avg = v.length ? v.reduce((x,y)=>x+y,0)/v.length : 0;
      sc[id] = Math.round(avg*100); info[id] = {avg, perf:v.filter(x=>x===2).length, n:v.length};
    }
    res = ranked(G, sc, id=>`Ø ${(info[id].avg).toFixed(1).replace('.',',')}`+(info[id].perf?` · ${info[id].perf}× perfekt`:''));
    G.gal = (G.vorder||[]).map(id=>({id, img:S.drawings[id]}));
    G.cur = null; G.sub='';
  } else if(G.gt==='hol'){
    const sc = {}, survivors = G.pl.filter(p=>!(p.id in G.out) || (G.hres && G.hres.all && G.alive.includes(p.id)));
    for(const p of G.pl) sc[p.id] = (p.id in G.out) ? G.out[p.id] : 99;
    if(G.hres && G.hres.all) G.alive.forEach(id=>{ sc[id] = G.hi+0.5; });
    res = ranked(G, sc, id => sc[id]>=99 ? 'bis zum Schluss' : `raus bei Paar ${Math.floor(sc[id])+1}`);
    G.sub = 'end';
  } else if(G.gt==='ttt'){
    for(const m of (G.ttt||[])) for(const side of ['a','b']){
      const id = m[side]; if(id==='bot') continue;
      const opp = m[side==='a'?'b':'a'], vs = opp==='bot' ? 'gegen Bot' : 'gegen '+plById(opp).n;
      if(m.w==='d' || !m.w) res.push({id, v:vs, s:1, t:'Unentschieden', w:0, dd:0});
      else if(m.w===side) res.push({id, v:vs, s:0, t:'Gewonnen · verteilt 2', w:1, dd:2});
      else res.push({id, v:vs, s:2, t:'Verloren', w:0, dd:0});
    }
  } else if(G.gt==='wwe'){
    const votes = {}; G.pl.forEach(p=>votes[p.id]=0);
    for(const id in a) if(a[id] in votes) votes[a[id]]++;
    const max = Math.max(0, ...Object.values(votes));
    G.top = max>0 ? G.pl.filter(p=>votes[p.id]===max).map(p=>p.id) : [];
    for(const p of G.pl){
      const voted = p.id in a, s = votes[p.id] + (voted?0:1);
      const parts = []; if(max>0 && votes[p.id]===max) parts.push('Meiste Stimmen'); if(!voted) parts.push('Nicht abgestimmt +1');
      res.push({id:p.id, v:votes[p.id]+(votes[p.id]===1?' Stimme':' Stimmen'), s, t:parts.join(' · '), w:0, dd:0});
    }
    res.sort((x,y)=>y.s-x.s);
  }
  for(const r of res){
    const st = G.st[r.id] || (G.st[r.id] = {s:0, w:0, d:0, n:0});
    st.s += r.s; st.w += r.w; st.d += r.dd; st.n++;
  }
  const maxS = Math.max(0, ...res.map(r=>r.s));
  G.hist.push({r:G.r, gt:G.gt, w:res.filter(r=>r.w).map(r=>r.id).slice(0,3), l:maxS>0?res.filter(r=>r.s===maxS).map(r=>r.id).slice(0,3):[]});
  G.res = res; G.ph = 'reveal'; G.ac = [];
  const last = G.mode==='mix' && G.r>=G.len;
  schedule(T_REVEAL, last ? endGame : startRound);
  pushG();
}
function endGame(){ clearSchedule(); S.G.ph='end'; S.G.gal=null; pushG(); }

/* ---------- Busfahrer (eigenes Spiel mit Schafkopf-Karten) ---------- */
const BSUIT = {E:{n:'Eichel', c:'#9b5a2a', black:true}, S:{n:'Schellen', c:'#e0a019', black:true}, G:{n:'Gras', c:'#2f9e4f', black:false}, H:{n:'Herz', c:'#e0263f', black:false}};
const BRANK = {'7':7,'8':8,'9':9,'Z':10,'U':11,'O':12,'K':13,'A':14};
const BLAB = {'7':'7','8':'8','9':'9','Z':'10','U':'U','O':'O','K':'K','A':'A'};
const isCard = c => typeof c==='string' && /^[ESGH][789ZUOKA]$/.test(c);
const cval = c => BRANK[c[1]];
const newDeck = () => shuffle(['E','S','G','H'].flatMap(s=>Object.keys(BRANK).map(r=>s+r)));
const cardName = c => BSUIT[c[0]].n+' '+({U:'Unter',O:'Ober',K:'König',A:'Ass',Z:'10'}[c[1]]||c[1]);
const SICON = {
  H:'<path d="M12 21C3 14 2 9 5 6c2.5-2.5 5.5-1.5 7 1 1.5-2.5 4.5-3.5 7-1 3 3 2 8-7 15z"/>',
  G:'<path d="M12 2C5 7 4 14 12 22 20 14 19 7 12 2z"/><path d="M12 6v14" stroke="#fffaf0" stroke-width="1.4" fill="none"/>',
  E:'<path d="M5 10c0-3.5 3-5.5 7-5.5s7 2 7 5.5z"/><path d="M7 10.5h10c0 6-2.5 10-5 10s-5-4-5-10z"/><path d="M12 4.5V2" stroke-width="2"/>',
  S:'<circle cx="12" cy="13" r="8"/><path d="M5 12.5h14" stroke="#fffaf0" stroke-width="1.4"/><circle cx="12" cy="16.5" r="1.6" fill="#fffaf0" stroke="none"/><circle cx="12" cy="4" r="1.8"/>'
};
const suitSVG = (s,sz) => `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="${BSUIT[s].c}" stroke="${BSUIT[s].c}" aria-hidden="true">${SICON[s]}</svg>`;
function bcard(c, o={}){
  const cls = (o.size?' '+o.size:'') + (o.hl?' hl':'') + (o.ghost?' ghost':'');
  if(o.back || !isCard(c)) return `<div class="bc back${cls}" aria-label="verdeckte Karte"></div>`;
  return `<div class="bc${cls}" aria-label="${cardName(c)}"><span class="bl">${BLAB[c[1]]}</span>${suitSVG(c[0], o.size==='sm'?18:o.size==='lg'?44:28)}<span class="bl br">${BLAB[c[1]]}</span></div>`;
}
const BQ = {
  1:{q:'Schwarz oder Rot?', o:[['b','Schwarz'],['r','Rot']], n:1, hint:'Eichel und Schellen zählen als schwarz, Gras und Herz als rot.'},
  2:{q:'Drunter oder drüber?', o:[['u','Drunter'],['o','Drüber']], n:2, hint:'Im Vergleich zu deiner ersten Karte. Gleich zählt als falsch.'},
  3:{q:'Drinnen oder draußen?', o:[['i','Drinnen'],['a','Draußen']], n:1, hint:'Liegt die Karte zwischen deinen ersten beiden Karten oder außerhalb?'}
};
const PROW = i => i<4 ? 1 : i<7 ? 2 : i<9 ? 3 : 4;
const T_BASK = 20000, T_BSHOW = 3500, T_FLIP = 9000, T_RIDE = 25000;
function bev(to, txt, key){
  const b = S.G.b; b.evq++;
  const old = key && b.ev.find(e=>e.key===key && Date.now()-(S.evT[key]||0) < 6000);
  if(old){ old.q=b.evq; old.txt=txt; } else { b.ev.push({q:b.evq, to, txt, key:key||''}); if(b.ev.length>30) b.ev.shift(); }
  if(key) S.evT[key]=Date.now();
}
function startBus(){
  const G = S.G; G.ph='play'; G.r=1;
  const ord = G.pl.slice(0,7).map(p=>p.id);
  S.bdeck = newDeck(); S.actSeen = {}; S.evT = {}; S.giveN = {};
  G.b = {st:'ask', round:1, turn:0, ord, hands:{}, cred:{}, drank:{}, gave:{}, ev:[], evq:0, last:null, pyr:[], flip:0, laid:[], king:null, driver:null, co:null, ride:null};
  ord.forEach(id=>{ G.b.hands[id]=[]; G.b.cred[id]=0; G.b.drank[id]=0; G.b.gave[id]=0; });
  busAsk();
}
function busAsk(){
  const G = S.G, b = G.b; b.st='ask'; b.last=null; G.rk=newKey(); resetAnswers();
  schedule(T_BASK, ()=>busResolve(BQ[b.round].o[Math.floor(Math.random()*2)][0]));
  pushG();
}
function busResolve(g){
  const G = S.G, b = G.b; if(b.st!=='ask') return;
  const id = b.ord[b.turn], h = b.hands[id];
  if(!S.bdeck.length) S.bdeck = newDeck();
  const c = S.bdeck.pop(), v = cval(c); let ok = false;
  if(b.round===1) ok = (g==='b') === BSUIT[c[0]].black;
  if(b.round===2){ const base = cval(h[0]); ok = g==='o' ? v>base : v<base; }
  if(b.round===3){ const lo = Math.min(cval(h[0]),cval(h[1])), hi = Math.max(cval(h[0]),cval(h[1])); ok = g==='i' ? (v>lo && v<hi) : (v<lo || v>hi); }
  h.push(c);
  const n = BQ[b.round].n;
  if(ok) b.cred[id] += n; else { b.drank[id] += n; bev(id, `Falsch geraten. Trink ${sipTxt(n)}!`); }
  b.last = {id, g, c, ok, n}; b.st = 'show';
  schedule(T_BSHOW, ()=>{
    b.turn++; if(b.turn>=b.ord.length){ b.turn=0; b.round++; }
    if(b.round>3) busPyramid(); else busAsk();
  });
  pushG();
}
function busPyramid(){
  const G = S.G, b = G.b; b.st='pyr'; b.pyr = S.bdeck.splice(-10); b.flip=0; b.laid = b.pyr.map(()=>[]);
  schedule(3000, busFlip); pushG();
}
function busFlip(){
  const b = S.G.b; if(b.st!=='pyr') return;
  if(b.flip>=b.pyr.length) return busKing();
  b.flip++; S.G.rk = newKey();
  schedule(T_FLIP, busFlip); pushG();
}
function busAction(id, x){
  const G = S.G, b = G.b; if(!b || !b.ord.includes(id)) return;
  if(x.t==='give'){
    const to = String(x.to); if(!(b.cred[id]>0) || !b.ord.includes(to) || to===id) return;
    b.cred[id]--; b.drank[to]++; b.gave[id]++;
    const k = id+'>'+to; S.giveN[k] = (Date.now()-(S.evT[k]||0) < 6000 ? (S.giveN[k]||0) : 0) + 1;
    bev(to, `${plById(id).n} gibt dir ${sipTxt(S.giveN[k])}!`, k);
  }
  if(x.t==='lay'){
    if(b.st!=='pyr' || b.flip<1) return;
    const idx = b.flip-1, top = b.pyr[idx], c = String(x.c), h = b.hands[id];
    if(!isCard(c) || !h.includes(c) || c[1]!==top[1]) return;
    h.splice(h.indexOf(c),1); b.laid[idx].push([id,c]);
    b.cred[id] += 2*PROW(idx);
  }
}
function busKing(){
  const b = S.G.b, cnt = id => b.hands[id].length;
  const counts = [...new Set(b.ord.map(cnt))].sort((x,y)=>y-x);
  const grp = k => b.ord.filter(id=>cnt(id)===counts[k]);
  const g1 = grp(0), g2 = counts.length>1 ? grp(1) : [];
  b.driver=null; b.co=null; S.kStages=[];
  if(g1.length===1){ b.driver=g1[0]; S.kStages.push({role:'co', cands:g2}); }
  else { S.kStages.push({role:'driver', cands:g1}); S.kStages.push({role:'co', cands:null}); }
  b.st='king'; S.kPrev = g1; nextKing();
}
function nextKing(){
  const b = S.G.b, stg = S.kStages.shift();
  if(!stg) return busRide();
  const cands = (stg.cands || S.kPrev).filter(id=>id!==b.driver);
  if(!cands.length) return nextKing();
  if(cands.length===1){ b[stg.role]=cands[0]; return nextKing(); }
  S.kdeck = newDeck(); b.king = {role:stg.role, cands, deals:[], win:null, i:0};
  schedule(1800, kingDeal); pushG();
}
function kingDeal(){

  else schedule(900, kingDeal);

function busRide(){
  const b = S.G.b; S.rdeck = newDeck();

function rideAsk(){
  const G = S.G, r = G.b.ride; r.sub='ask'; G.rk=newKey(); resetAnswers();
  schedule(T_RIDE, ()=>rideResolve(Math.random()<.5?'u':'o')); pushG();
}
function rideResolve(g){
  const b = S.G.b, r = b.ride; if(!r || r.sub!=='ask') return;
  if(!S.rdeck.length) S.rdeck = newDeck().filter(c=>!r.tb.includes(c));
  const base = r.tb[r.pos], d = S.rdeck.pop(); r.up[r.pos]=1;
  const ok = g==='o' ? cval(d)>cval(base) : cval(d)<cval(base);
  r.last = {pos:r.pos, base, d, g, ok}; r.tb[r.pos] = d;
  if(ok) r.pos++;
  else {
    const n = r.pos+1; r.fails++;
    [b.driver, b.co].filter(Boolean).forEach(id=>{ b.drank[id]+=n; bev(id, `Bus-Crash bei Karte ${n}! Trink ${sipTxt(n)}.`); });
    r.pos = 0;
  }
  r.sub='show';

}
function busEnd(){ clearSchedule(); const G=S.G; G.b.st='end'; G.ph='end'; pushG(); }
function ansOf(id){ const a = id===S.myId ? S.myAns : (S.peerMap[id] && S.peerMap[id].presence && S.peerMap[id].presence.ans); return a && a.k===S.G.rk ? a.v : undefined; }
function busSync(){
  const b = S.G.b; if(!b) return pushG();
  for(const id of b.ord){
    if(id===S.myId) continue;
    const p = S.peerMap[id], acts = p && p.presence && Array.isArray(p.presence.act) ? p.presence.act : [];
    for(const x of acts){ if(!x || typeof x.i!=='number' || x.i <= (S.actSeen[id]||0)) continue; S.actSeen[id]=x.i; busAction(id, x); }
  }
  if(b.st==='ask'){ const v = ansOf(b.ord[b.turn]); if(BQ[b.round].o.some(o=>o[0]===v)) return busResolve(v); }
  if(b.st==='ride' && b.ride.sub==='ask'){ const v = ansOf(b.driver); if(v==='u' || v==='o') return rideResolve(v); }
  pushG();
}
// Spieleraktionen (Ablegen, Verteilen) laufen beim Host über busAction, bei Mitspielern über die Presence
function busDo(x){
  const G = S.G; if(!G || !G.b) return;
  if(S.mode==='host' || S.mode==='local'){ busAction(x.who || S.myId, x); pushG(); return; }
  S.actSeq = (S.actSeq||0)+1; S.myActs = [...(S.myActs||[]), {...x, i:S.actSeq}].slice(-40);
  S.nr.presence({act:S.myActs});
}
function busGuess(v){
  const G = S.G, b = G.b; if(!b) return;
  const forRide = b.st==='ride';
  if(S.mode==='local' || S.mode==='host'){
    const me = S.mode==='local' ? null : S.myId;
    if(forRide){ if(me && b.driver!==me) return; return rideResolve(v); }
    if(me && b.ord[b.turn]!==me) return; return busResolve(v);
  }
  S.myAns = {k:G.rk, v}; S.nr.presence({ans:S.myAns}); render();
}
function sanitizeBus(x){
  if(!x || typeof x!=='object') return null;
  const ids = Array.isArray(x.ord) ? x.ord.map(String).slice(0,7) : [];
  const num = o => { const r={}; ids.forEach(id=>{ r[id]=Number(o && o[id])||0; }); return r; };
  const cards = a => Array.isArray(a) ? a.filter(isCard) : [];
  const hands = {}; ids.forEach(id=>{ hands[id]=cards(x.hands && x.hands[id]); });
  const pyr = cards(x.pyr);
  return {
    st:String(x.st), round:Number(x.round)||1, turn:Number(x.turn)||0, ord:ids, hands, cred:num(x.cred), drank:num(x.drank), gave:num(x.gave),
    ev:Array.isArray(x.ev) ? x.ev.map(e=>({q:Number(e.q)||0, to:String(e.to), txt:String(e.txt).slice(0,90), key:String(e.key||'')})) : [], evq:Number(x.evq)||0,
    last: x.last && isCard(x.last.c) ? {id:String(x.last.id), g:String(x.last.g), c:x.last.c, ok:!!x.last.ok, n:Number(x.last.n)||0} : null,
    pyr, flip:Math.min(pyr.length, Number(x.flip)||0), laid: Array.isArray(x.laid) ? x.laid.map(l=>Array.isArray(l)?l.filter(p=>Array.isArray(p)&&isCard(p[1])).map(p=>[String(p[0]),p[1]]):[]) : [],
    king: x.king && Array.isArray(x.king.deals) ? {role:String(x.king.role), cands:(x.king.cands||[]).map(String), deals:x.king.deals.filter(d=>Array.isArray(d)&&isCard(d[1])).map(d=>[String(d[0]),d[1]]), win:x.king.win?String(x.king.win):null} : null,
    driver: x.driver ? String(x.driver) : null, co: x.co ? String(x.co) : null,
    ride: x.ride && Array.isArray(x.ride.tb) ? {tb:cards(x.ride.tb), up:(x.ride.up||[]).map(Boolean), pos:Number(x.ride.pos)||0, fails:Number(x.ride.fails)||0, sub:String(x.ride.sub),
      last: x.ride.last && isCard(x.ride.last.d) ? {pos:Number(x.ride.last.pos)||0, base:x.ride.last.base, d:x.ride.last.d, g:String(x.ride.last.g), ok:!!x.ride.last.ok} : null} : null
  };
}

async function createRoom(kind){
  if(!S.roomApi || S.busy || needName()) return;
  S.busy=true; S.err=''; render();
  try{
    for(let i=0;i<4;i++){
      const code = genCode();
      let nr;
      try{ nr = await openHub(code); }catch(e){ if(e && e.code==='taken') continue; throw e; }
      S.nr=nr; S.code=code; S.mode='host'; S.G=newG(); S.G.kind = kind==='bus' ? 'bus' : 'party'; S.lastG=''; S.myAns=null; S.evSeen=null;
      const me = nr.peers().find(p=>p.sameTab); S.myId = me && me.peer ? me.peer : 'host';
      await nr.presence({role:'host', p:prof()});
      nr.onPeers(()=>hostSync(), onRoomErr);
      wake(); S.busy=false; hostSync(); return;
    }
    throw {code:'kein freier Code'};
  }catch(e){
    S.busy=false; S.mode=null; S.nr=null;
    S.err='Der Raum konnte nicht erstellt werden ('+(e&&e.code||'Fehler')+'). Versuch es nochmal oder spielt auf einem Handy.'; render();

async function joinRoom(){
  if(!S.roomApi || S.busy || needName()) return;
  const code = (S.codeDraft||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==4){ S.err='Der Raum-Code hat 4 Zeichen.'; render(); return; }
  S.busy=true; S.err=''; render();
  try{
    const nr = await openLeaf(code);
    S.nr=nr; S.code=code; S.mode='player'; S.G=null; S.hostSeen=false; S.lost=false; S.myAns=null;
    await nr.presence({role:'player', p:prof()});

    wake(); S.busy=false; render();
  }catch(e){
    S.busy=false; S.mode=null; S.nr=null;
    S.err = (e && e.code==='not_found') ? 'Kein Raum mit dem Code '+code+' gefunden. Prüf den Code.' : 'Beitreten hat nicht geklappt ('+(e&&e.code||'Fehler')+').'; render();

function submitAnswer(v, rk){

    $ov.innerHTML=`<div class="ov-in ov-center"><p class="eyebrow">${gt==='draw'?'Abgegeben':'Dein Ergebnis'}</p><h1>${esc(r.d)}</h1><p class="muted">Warte auf die anderen …</p></div>`;

  const intro = gt==='draw' ? `<p class="eyebrow">Zeichne gleich</p><h1 class="drawname">${esc(DRAWQ[seed%DRAWQ.length])}</h1>` : `<p class="eyebrow">${esc(g.kind)}</p><h1>${esc(g.name)}</h1>`;

const MINI = {

    let col='#16133a', alpha=1, tool='pen', lastTool='pen', size=8, hsv=[245,.66,.23], iv=null, sprayIv=null;
    const t0 = performance.now();
    root.innerHTML = `<div class="ov-in draw-ov">

      <canvas class="drawc" id="dc"></canvas>
      <div class="dtools" id="dtools">${TOOLS.map(([k,l,ic])=>`<button class="tool${k===tool?' on':''}" data-t="${k}" aria-pressed="${k===tool}">${ic}<span>${l}</span></button>`).join('')}</div>

      <div class="picker" id="picker" hidden>

    </div>`;
    $ov.classList.add('drawing-mode');
    const $ = s => root.querySelector(s);
    const cv = $('#dc'), ctx = cv.getContext('2d', {willReadFrequently:true});
    const dpr = Math.min(2, window.devicePixelRatio||1), PX = Math.round(SZ*dpr);
    cv.width = PX; cv.height = PX; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,SZ,SZ);
    const undo = [];
    const snap = () => ctx.getImageData(0,0,PX,PX);
    const pushUndo = () => { undo.push(snap()); if(undo.length>20) undo.shift(); };

    // Farben
    const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
    const rgb2hex = (r,g,b) => '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
    function hsv2rgb(h,s,v){ const f=n=>{ const k=(n+h/60)%6; return v - v*s*Math.max(0,Math.min(k,4-k,1)); }; return [f(5)*255,f(3)*255,f(1)*255]; }
    function rgb2hsv(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
      if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0) h+=360; }
      return [h, mx?d/mx:0, mx]; }
    const rgba = () => { const [r,g,b]=hex2rgb(col); return `rgba(${r},${g},${b},${alpha})`; };
    function setColor(hex, fromPicker){
      col = hex.toLowerCase();
      if(!fromPicker){ const [r,g,b]=hex2rgb(col); const h=rgb2hsv(r,g,b); if(h[1]===0) h[0]=hsv[0]; hsv=h; }
      $('#cur').style.background = rgba();
      $('#hex').value = col.toUpperCase();
      root.querySelectorAll('.tc').forEach(x=>x.classList.toggle('on', x.dataset.c===col));
      if(tool==='erase' || tool==='pick') setTool(lastTool==='erase'||lastTool==='pick'?'pen':lastTool);

    }
    function setTool(t){

      root.querySelectorAll('.tool').forEach(b=>{ const on=b.dataset.t===t; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });

    // Farbwähler
    const sv=$('#sv'), hue=$('#hue'), alp=$('#alp');
    function sizePicker(){ for(const c of [sv,hue,alp]){ const r=c.getBoundingClientRect(); c.width=Math.max(10,Math.round(r.width*dpr)); c.height=Math.max(10,Math.round(r.height*dpr)); } }
    function paintPicker(){
      let c=sv.getContext('2d'), W=sv.width, H=sv.height;
      const [hr,hg,hb]=hsv2rgb(hsv[0],1,1);
      c.fillStyle=`rgb(${hr},${hg},${hb})`; c.fillRect(0,0,W,H);
      let g=c.createLinearGradient(0,0,W,0); g.addColorStop(0,'#fff'); g.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
      g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'#000'); c.fillStyle=g; c.fillRect(0,0,W,H);
      const mx=hsv[1]*W, my=(1-hsv[2])*H; c.lineWidth=3*dpr; c.strokeStyle='#fff'; c.beginPath(); c.arc(mx,my,8*dpr,0,6.3); c.stroke(); c.lineWidth=1.5*dpr; c.strokeStyle='#000'; c.beginPath(); c.arc(mx,my,10*dpr,0,6.3); c.stroke();
      c=hue.getContext('2d'); W=hue.width; H=hue.height;
      g=c.createLinearGradient(0,0,W,0); for(let i=0;i<=6;i++){ const [r,gg,b]=hsv2rgb(i*60,1,1); g.addColorStop(i/6,`rgb(${r},${gg},${b})`); }
      c.fillStyle=g; c.fillRect(0,0,W,H);
      const hx=hsv[0]/360*W; c.fillStyle='#fff'; c.strokeStyle='#16133a'; c.lineWidth=2*dpr; c.fillRect(hx-3*dpr,0,6*dpr,H); c.strokeRect(hx-3*dpr,1,6*dpr,H-2);
      c=alp.getContext('2d'); W=alp.width; H=alp.height;
      const sq=8*dpr; for(let x=0;x<W;x+=sq) for(let y=0;y<H;y+=sq){ c.fillStyle=((x/sq+y/sq)%2)?'#ddd':'#fff'; c.fillRect(x,y,sq,sq); }
      const [r,gg,b]=hex2rgb(col); g=c.createLinearGradient(0,0,W,0); g.addColorStop(0,`rgba(${r},${gg},${b},0)`); g.addColorStop(1,`rgb(${r},${gg},${b})`); c.fillStyle=g; c.fillRect(0,0,W,H);
      const ax=alpha*W; c.fillStyle='#fff'; c.fillRect(ax-3*dpr,0,6*dpr,H); c.strokeRect(ax-3*dpr,1,6*dpr,H-2);
    }
    function dragOn(el, fn){

      el.addEventListener('pointermove', e=>{ if(el._drag) go(e); });

    }
    const fromHsv = () => { const [r,g,b]=hsv2rgb(...hsv); setColor(rgb2hex(r,g,b), true); };
    dragOn(sv, (x,y)=>{ hsv[1]=x; hsv[2]=1-y; fromHsv(); });
    dragOn(hue, x=>{ hsv[0]=Math.min(359.9,x*360); fromHsv(); });
    dragOn(alp, x=>{ alpha=Math.max(.05,Math.round(x*100)/100); $('#cur').style.background=rgba(); paintPicker(); });

    const togglePicker = open => { const p=$('#picker'); p.hidden = open===undefined ? !p.hidden : !open; $('#cur').setAttribute('aria-expanded', !p.hidden); if(!p.hidden){ sizePicker(); paintPicker(); } };
    $('#cur').addEventListener('click', ()=>togglePicker());
    $('#pclose').addEventListener('click', ()=>togglePicker(false));
    $('#quick').addEventListener('click', e=>{ const b=e.target.closest('.tc'); if(b){ alpha=1; setColor(b.dataset.c); } });
    $('#dtools').addEventListener('click', e=>{ const b=e.target.closest('.tool'); if(b) setTool(b.dataset.t); });

    $('#undo').addEventListener('click', ()=>{ const s=undo.pop(); if(s) ctx.putImageData(s,0,0); });
    $('#clr').addEventListener('click', ()=>{ pushUndo(); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,PX,PX); ctx.restore(); });
    setColor(col);

    // Zeichnen
    let base=null, pts=null, down=false;
    const pos = e => { const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*SZ, y:(e.clientY-r.top)/r.height*SZ}; };
    function strokePath(){
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
      if(pts.length===1){ ctx.lineTo(pts[0].x+.01, pts[0].y); }
      for(let i=1;i<pts.length-1;i++){ const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2; ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my); }

    function renderStroke(){
      ctx.putImageData(base,0,0);
      ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';

      else if(tool==='pen'){ ctx.strokeStyle=rgba(); ctx.lineWidth=size; strokePath(); }

      const rad = size*1.6, n = Math.max(6, Math.round(size*1.2));

    }
    function pickAt(p){
      const d = ctx.getImageData(Math.max(0,Math.min(PX-1,Math.round(p.x*dpr))), Math.max(0,Math.min(PX-1,Math.round(p.y*dpr))), 1, 1).data;
      alpha = 1; setColor(rgb2hex(d[0],d[1],d[2]));
    }
    function flood(p){
      const x0=Math.floor(p.x*dpr), y0=Math.floor(p.y*dpr); if(x0<0||y0<0||x0>=PX||y0>=PX) return;
      const img = ctx.getImageData(0,0,PX,PX), d = img.data, W = PX;
      const i0 = (y0*W+x0)*4, tr=d[i0], tg=d[i0+1], tb=d[i0+2];

      if(Math.abs(tr-fr)+Math.abs(tg-fg)+Math.abs(tb-fb) < 6 && fa===1) return;
      const seen = new Uint8Array(W*W), stack = new Int32Array(W*W); let sp = 0;
      const ok = k => { if(seen[k]) return false; const i=k*4; return Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb) <= 90; };

        if(y>0 && !seen[k-W]) stack[sp++]=k-W; if(y<W-1 && !seen[k+W]) stack[sp++]=k+W;

      ctx.putImageData(img,0,0);
    }
    cv.addEventListener('pointerdown', e=>{
      e.preventDefault(); const p=pos(e);

    const up = () => { down=false; base=null; clearInterval(sprayIv); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    $('#ddone').addEventListener('click', end);
    iv = setInterval(()=>{ const left=Math.max(0,Math.ceil((DUR-(performance.now()-t0))/1000)); const el=$('#dt'); if(el){ el.textContent=left+' s'; el.classList.toggle('low', left<=10); } if(left<=0) end(); }, 250);

      if(ended) return; ended=true; clearInterval(iv); clearInterval(sprayIv);

  }

// startet Minigames und Zeichnen bei allen automatisch und gleichzeitig
function autoStart(){
  const G = S.G;
  if(!G || S.mode==='local' || !online()){ return; }
  const want = G.ph==='play' && (isMini(G.gt) || (G.gt==='draw' && G.sub==='draw'));
  if(S.miniRunning && (!want || S.miniRk!==G.rk)){ S.miniAbort && S.miniAbort(); }
  if(want && !S.miniRunning && S.autoDone!==G.rk && !(S.myAns && S.myAns.k===G.rk)){
    const rk = G.rk; S.autoDone = rk; S.miniRk = rk;
    runMini(G.gt, G.gt==='draw' ? G.qi : G.seed, r=>submitAnswer(r, rk));
  }
}

function tttHTML(){
